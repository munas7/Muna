<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Tower Defense</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Health:</span>
                    <span id="health" class="value">100</span>
                </div>
                <div class="stat">
                    <span class="label">Money:</span>
                    <span id="money" class="value">500</span>
                </div>
                <div class="stat">
                    <span class="label">Wave:</span>
                    <span id="wave" class="value">1</span>
                </div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="controls">
                <h3>Build Tower</h3>
                <button class="tower-btn" data-type="basic" data-cost="100">
                    Basic Tower<br>
                    <small>Cost: $100</small>
                </button>
                <button class="tower-btn" data-type="fast" data-cost="150">
                    Fast Tower<br>
                    <small>Cost: $150</small>
                </button>
                <button class="tower-btn" data-type="strong" data-cost="200">
                    Strong Tower<br>
                    <small>Cost: $200</small>
                </button>
                <button id="startWave" class="action-btn">Start Wave</button>
            </div>
        </div>
        
        <div class="instructions">
            <h3>How to Play</h3>
            <p>1. Click a tower type to select it</p>
            <p>2. Click on the map to place the tower</p>
            <p>3. Start the wave to spawn enemies</p>
            <p>4. Defend your base!</p>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
